<!doctype html>
<html lang="en">

<head>
  <title>Login 05</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="ftco-section">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-6 text-center mb-5">
        <h2 class="heading-section">Login #05</h2>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">

        <div class="wrap">

          <div class="img" style="background-image: url(images/bg-1.jpg);"></div>

          <div class="login-wrap p-4 p-md-5">

            <h3 class="mb-4">Silahkan Login</h3>

            <!-- FORM LOGIN -->
            <form id="loginForm">

              <div class="form-group mt-3">
                <input type="text" id="username" class="form-control" placeholder="Nama Pengguna..." required>
                <label class="form-control-placeholder">Username</label>
              </div>

              <div class="form-group mt-3">
                <input type="password" id="password" class="form-control" placeholder="Password..." required>
                <label class="form-control-placeholder">Password</label>
              </div>

              <div class="form-group">
                <button type="submit" class="form-control btn btn-primary rounded submit px-3">
                  Masuk
                </button>
              </div>

              <!-- ALERT / MESSAGE DARI JS -->
              <div id="alertBox" class="alert" style="display:none;"></div>

              <div class="form-group d-md-flex">

                <div class="w-50 text-left">
                  <label class="checkbox-wrap checkbox-primary mb-0">
                    Remember Me
                    <input type="checkbox" checked>
                    <span class="checkmark"></span>
                  </label>
                </div>

                <div class="w-50 text-md-right">
                  <a href="#">Forgot Password</a>
                </div>

              </div>

            </form>

            <!-- LINK REGISTER -->
            <p class="text-center">
              Belum punya akun? <a href="register.html">Daftar</a>
            </p>

            <div class="social">
              <div class="go">
                <a href="register.html">DAFTAR</a>
              </div>
              <div class="kanan">
                <i class="fa fa-google"></i> Google
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>

  </div>
</section>

<!-- SCRIPT WAJIB DI PALING BAWAH -->
<script src="js/jquery.min.js"></script>
<script src="js/popper.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/login.js"></script>

</body>
</html>
