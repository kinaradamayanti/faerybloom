<!doctype html>
<html lang="en">

<head>
  <title>Register 05</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<section class="ftco-section">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-md-6 text-center mb-5">
        <h2 class="heading-section">Register #05</h2>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">

        <div class="wrap">
          <div class="img" style="background-image: url(images/bg-1.jpg);"></div>

          <div class="login-wrap p-4 p-md-5">

            <h3 class="mb-4">Sign Up</h3>

            <!-- FORM REGISTER -->
            <form id="registerForm" class="signin-form">

              <!-- USERNAME -->
              <div class="form-group mt-3">
                <input type="text" id="username" class="form-control" required>
                <label class="form-control-placeholder">Username</label>
              </div>

              <!-- EMAIL -->
              <div class="form-group mt-3">
                <input type="email" id="email" class="form-control" required>
                <label class="form-control-placeholder">Email</label>
              </div>

              <!-- PASSWORD -->
              <div class="form-group">
                <input type="password" id="password" class="form-control" required>
                <label class="form-control-placeholder">Password</label>
              </div>

              <!-- BUTTON -->
              <div class="form-group">
                <button type="submit" class="form-control btn btn-primary rounded submit px-3">
                  Daftar
                </button>
              </div>

              <!-- MESSAGE -->
              <p id="message"></p>

              <!-- SOCIAL / DEVER BAGIAN BAWAH -->
              <div class="social">

                <div class="go">
                  <a href="index.html">Login</a>
                </div>

                <div class="kanan">
                  <i class="fa fa-google"></i> Google
                </div>

              </div>

            </form>

            <p class="text-center">
              Sudah punya akun? <a href="index.html">Login</a>
            </p>

          </div>
        </div>

      </div>
    </div>

  </div>
</section>

<!-- SCRIPT (INI YANG KAMU MAKSUD DEFER) -->
<script src="js/jquery.min.js"></script>
<script src="js/popper.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/main.js"></script>
<script src="js/register.js" defer></script>

</body>
</html>
